<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de Lucro</title>
<style>
body{font-family:Arial,sans-serif;max-width:520px;margin:0 auto;padding:24px;background:#f5f5f5;color:#222}
.card{background:white;padding:22px;border-radius:16px;box-shadow:0 4px 18px #0001}
h1{margin-top:0} label{display:block;margin-top:14px;font-weight:700}
input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.result{margin-top:20px;padding:15px;background:#f0f0f0;border-radius:10px;line-height:1.8}
</style>
</head>
<body>
<div class="card">
<h1>💰 Calculadora de Lucro</h1>
<p>Descubra quanto você ganha por venda e sua margem.</p>

<label>Custo do produto (R$)
<input id="custo" type="number" step="0.01" min="0" placeholder="10,00">
</label>

<label>Preço de venda (R$)
<input id="preco" type="number" step="0.01" min="0" placeholder="20,00">
</label>

<label>Quantidade vendida
<input id="qtd" type="number" step="1" min="1" value="1">
</label>

<button onclick="calcular()">Calcular</button>

<div id="resultado" class="result" hidden></div>
</div>

<script>
function dinheiro(v){
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function calcular(){
  const custo=Number(document.getElementById('custo').value);
  const preco=Number(document.getElementById('preco').value);
  const qtd=Number(document.getElementById('qtd').value);
  const box=document.getElementById('resultado');

  if(custo<0 || preco<0 || qtd<1 || !Number.isFinite(custo+preco+qtd)){
    box.hidden=false;
    box.innerHTML="⚠️ Preencha os valores corretamente.";
    return;
  }

  const lucroUnit=preco-custo;
  const lucroTotal=lucroUnit*qtd;
  const margem=preco>0 ? (lucroUnit/preco)*100 : 0;

  box.hidden=false;
  box.innerHTML =
    "<b>Lucro por unidade:</b> "+dinheiro(lucroUnit)+"<br>"+
    "<b>Lucro total:</b> "+dinheiro(lucroTotal)+"<br>"+
    "<b>Margem de lucro:</b> "+margem.toFixed(2)+"%";
}
</script>
</body>
</html>
